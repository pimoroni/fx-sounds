[rail_uk_yodel]
description = UK level crossing yodel alarm
length = 2.4
wave = square
pitch = log 900@0 1350@0.12 900@0.24
drive = 1.5
highpass = 400
lowpass = 5000
peak_eq = 1800 5 1.0

[rail_us_crossing_bell]
description = US level crossing bell
length = 2.2
reverb_wet = -4
wave = sine
pitch = 1350
gate = log 1@0 0.01@0.55
gate_slew = 0.001

[rail_us_crossing_bell.p2]
pitch_scale = 2.32
gate = log 1@0 0.002@0.55
level = -4

[rail_us_crossing_bell.p3]
pitch_scale = 4.25
gate = log 1@0 0.0005@0.55
level = -9

[rail_us_crossing_bell.p4]
pitch_scale = 6.63
gate = log 1@0 0.0002@0.55
level = -13

[rail_us_train_horn]
description = US five-chime locomotive horn, sustained
length = 2.0
reverb_time = 2.5
reverb_width = 40
wave = saw
pitch = 311
vibrato = 0.04 2
drive = 3
highpass = 120
lowpass = 3500
peak_eq = 800 4 1.0

[rail_us_train_horn.f]
pitch = 370

[rail_us_train_horn.g]
pitch = 415
level = -1

[rail_us_train_horn.b]
pitch = 494
level = -2

[rail_us_train_horn.d]
pitch = 622
level = -4

[rail_uk_train_horn]
description = UK two-tone train horn, high then low
length = 3.0
reverb_time = 2.5
reverb_width = 40
wave = saw
pitch = step 380@0 290@0.7 290@3.0
glide = 0.015
gate = 1@0 0@1.4 0@3.0
gate_slew = 0.02
drive = 3
highpass = 120
lowpass = 3500
peak_eq = 800 4 1.0
