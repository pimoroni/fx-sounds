[scifi_red_alert]
description = Starship red alert whoop
reverb_time = 2.2
wave = triangle
pitch = linear 350@0 1000@0.7 1000@1.0
gate = 1@0 0@0.75 0@1.0
drive = 2
highpass = 150
lowpass = 5000
peak_eq = 1200 4 1.0

[scifi_red_alert.sub]
wave = sine
pitch_scale = 0.5
drive = 0
level = -8

[scifi_klaxon]
description = Harsh dissonant klaxon
wave = square
pitch = 155
gate = 1@0 0@0.55 0@0.8
drive = 4
highpass = 150
lowpass = 3500
peak_eq = 900 8 0.8

[scifi_klaxon.second]
pitch = 220
level = -2

[scifi_dive]
description = Submarine dive alarm
wave = saw
pitch = log 160@0 320@0.55 320@1.2
gate = 1@0 0@0.6 0@1.2
glide = 0.01
drive = 3
highpass = 100
lowpass = 3000
peak_eq = 600 6 1.0

[scifi_warble]
description = Fast warbling alert tone
wave = square
pitch = 820
vibrato = 3 14
lowpass = 4000
peak_eq = 1600 3 1.0

[scifi_evacuate]
description = Evacuation whoop with a buzzing edge
wave = triangle
pitch = smooth 500@0 900@0.25 500@0.5
drive = 1.5
lowpass = 5000

[scifi_evacuate.edge]
wave = pulse
pulse_width = 0.25
pitch_scale = 1.5
level = -10

[scifi_self_destruct]
description = Double beep countdown alarm
wave = sine
pitch = 1320
gate = 1@0 0@0.15 1@0.25 0@0.4 0@1.0
drive = 0.8

[scifi_self_destruct.fifth]
pitch_scale = 1.5
level = -6

[scifi_teleporter]
