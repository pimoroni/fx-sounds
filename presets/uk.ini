[uk_two_tone]
description = Classic UK pneumatic two-tone horns, the old nee-naw
length = 2.4
wave = saw
pitch = step 920@0 690@0.6 920@1.2
glide = 0.02
drive = 2.5
highpass = 300
lowpass = 4500
peak_eq = 1400 4 1.2

[uk_wail]
