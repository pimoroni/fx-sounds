[alarm_smoke]
description = Domestic smoke alarm, temporal-3 pattern
wave = square
pitch = 3150
gate = 1@0 0@0.5 1@1.0 0@1.5 1@2.0 0@2.5 0@4.0
lowpass = 6000

[alarm_us_t3_horn]
description = US fire alarm horn, temporal-3 pattern
wave = pulse
pulse_width = 0.3
pitch = 520
gate = 1@0 0@0.5 1@1.0 0@1.5 1@2.0 0@2.5 0@4.0
drive = 2
lowpass = 5000
peak_eq = 1500 4 1.0

[alarm_uk_fire_sounder]
description = UK fire alarm sounder, alternating tones
length = 1.0
wave = square
pitch = step 970@0 800@0.25 970@0.5
lowpass = 5000
peak_eq = 2000 3 1.0

[alarm_reversing]
description = Vehicle reversing beeper
wave = square
pitch = 1100
gate = 1@0 0@0.5 0@1.0
drive = 1.5
lowpass = 4000

[alarm_car]
description = Car alarm whoop
length = 1.75
wave = square
pitch = log 700@0 1800@0.35
drive = 1.5
highpass = 300
lowpass = 5000
peak_eq = 1800 4 1.0
